[project]
name = "guardrailed-cisco-compliance"
version = "0.1.0"
description = "Lab-only guardrailed Cisco configuration compliance prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "netmiko>=4.4,<5.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "websockets>=13.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]